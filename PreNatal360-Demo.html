<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PreNatal 360® - Demo Educativa</title>
<style>body{font-family:Arial,sans-serif;max-width:520px;margin:0 auto;padding:20px;background:#fdf6f0;color:#222}h1{color:#8e3a59;font-size:24px}small{color:#555}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin:14px 0}label{font-weight:bold;display:block;margin:12px 0 6px}input[type=date]{width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:10px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#8e3a59;color:#fff;font-size:17px;font-weight:bold;margin-top:14px}.q{border-top:1px solid #eee;padding:12px 0}.q p{margin:0 0 8px;font-weight:bold}.opts{display:flex;gap:10px}.opts label{flex:1;text-align:center;border:1px solid #ddd;border-radius:10px;padding:10px;font-weight:normal;cursor:pointer}.opts input{display:none}.opts input:checked+span{font-weight:bold}.red{background:#ffe6e6;border:2px solid #d33;padding:16px;border-radius:12px;font-size:18px}.green{background:#e6ffe6;border:2px solid #2a8a2a;padding:16px;border-radius:12px;font-size:18px}.hidden{display:none}</style></head>
<body><h1>PreNatal 360® - Demo Educativa</h1><small>Solo educativo. Solo bajo riesgo. No es consejo médico.</small>
<div class="card" id="paso1"><label>¿Cuál fue el primer día de tu última regla?</label><input type="date" id="fur"><button onclick="calcular()">Calcular mi semana</button><p id="semana" style="font-weight:bold"></p></div>
<div class="card hidden" id="paso2"><p><b>Ahora responde 5 preguntas con SÍ o NO:</b></p>
<div id="preguntas"></div>
<button onclick="resultado()">Ver mi resultado</button></div>
<div class="card hidden" id="res"></div>
<div class="card"><small>Demo de prueba. No guarda ningún dato. Cuando cierras la página, todo se borra. Si tienes una alerta, acude a consulta presencial urgente.</small><br><button onclick="location.reload()" style="background:#555">Volver a empezar</button></div>
<script>
const qs=["¿Tienes sangrado vaginal?","¿Tienes dolor de cabeza muy fuerte?","¿Ves borroso o ves lucecitas?","¿Se te hincharon mucho cara o manos de repente?","¿Dejaste de sentir a tu bebé?"];
document.getElementById('preguntas').innerHTML=qs.map((q,i)=>`<div class="q"><p>${i+1}. ${q}</p><div class="opts"><label><input type="radio" name="q${i}" value="no" checked><span>NO</span></label><label><input type="radio" name="q${i}" value="si"><span>SÍ</span></label></div></div>`).join('');
function calcular(){const v=document.getElementById('fur').value;if(!v){alert('Por favor escoge una fecha');return;}const f=new Date(v+'T00:00:00');const hoy=new Date();const dias=Math.floor((hoy-f)/86400000);if(dias<0){alert('La fecha no puede ser en el futuro');return;}const sem=Math.floor(dias/7);document.getElementById('semana').textContent='Estás en la semana '+sem+' (aproximado, solo para demo)';document.getElementById('paso2').classList.remove('hidden');window.scrollTo(0,document.getElementById('paso2').offsetTop);}
function resultado(){let alerta=false;for(let i=0;i<5;i++){if(document.querySelector(`input[name="q${i}"]:checked`).value==='si') alerta=true;}const r=document.getElementById('res');r.classList.remove('hidden');r.innerHTML=alerta?'<div class="red">⚠️ Por favor acude a consulta presencial urgente<br><small>No sigas con contenido educativo.</small></div>':'<div class="green">✅ Puedes seguir con contenido educativo de bajo riesgo<br><small>Recuerda tomar agua, descansar y acudir a tus controles.</small></div>';window.scrollTo(0,r.offsetTop);}
</script></body></html>
